name: Deploy

# Manual production deployment. Requires repository secrets:
#   CLOUDFLARE_API_TOKEN — minimal-permission token (Workers Scripts Edit,
#   D1 Edit, Account Settings Read), see docs/cloudflare.md.
# Production D1 migrations are applied manually on purpose (review gate).
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Create empty local vars file
        run: echo "" > .dev.vars

      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - name: Deploy worker
        run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
